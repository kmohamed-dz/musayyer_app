name: musayyer_app
description: Offline-first shop management app for Algerian merchants
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Routing
  go_router: ^14.2.7
  # Local DB
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Firebase backend
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  firebase_auth: ^6.1.4
  # Barcode
  mobile_scanner: ^5.1.1
  # PDF
  pdf: ^3.10.8
  printing: ^5.12.0
  # Files & sharing
  path_provider: ^2.1.3
  share_plus: ^12.0.1
  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  # Network (kept for future cloud sync)
  dio: ^5.4.3
  # Secure storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  # Code gen helpers
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
